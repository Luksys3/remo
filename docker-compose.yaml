x-logging: &logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "3"

services:
    caddy:
        image: caddy:2.11.4-alpine
        restart: unless-stopped
        depends_on:
            youtarr:
                condition: service_healthy
            navidrome:
                condition: service_healthy
        ports:
            - "80:80"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
        logging: *logging

    database:
        image: mysql:26.7.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DATABASE_NAME:?}
            MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:?}
            MYSQL_ROOT_HOST: "%"
            TZ: ${TZ:?}
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --innodb-file-per-table=1
        volumes:
            - database:/var/lib/mysql
        networks:
            - database
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    mysql --protocol=TCP --host=127.0.0.1 --user=root
                    --password="$${MYSQL_ROOT_PASSWORD}" --database="$${MYSQL_DATABASE}"
                    --execute='SELECT 1' >/dev/null 2>&1
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 60s
        logging: *logging

    youtarr:
        image: dialmaster/youtarr:v1.85.0
        user: "${PUID:?}:${PGID:?}"
        init: true
        restart: unless-stopped
        depends_on:
            database:
                condition: service_healthy
        environment:
            TZ: ${TZ:?}
            IN_DOCKER_CONTAINER: "1"
            DB_HOST: database
            DB_PORT: 3306
            DB_NAME: ${DATABASE_NAME:?}
            DB_USER: root
            DB_PASSWORD: ${DATABASE_PASSWORD:?}
            AUTH_ENABLED: "true"
            AUTH_PRESET_USERNAME: ${YOUTARR_ADMIN_USERNAME:?}
            AUTH_PRESET_PASSWORD: ${YOUTARR_ADMIN_PASSWORD:?}
            TRUST_PROXY: "1"
            # Host path for the UI; downloads use /usr/src/app/data inside the container.
            YOUTUBE_OUTPUT_DIR: ./media/youtube
        volumes:
            - type: bind
              source: ./media/youtube
              target: /usr/src/app/data
              bind:
                  create_host_path: false

            - type: bind
              source: ./data/youtarr/config
              target: /app/config
              bind:
                  create_host_path: false

            - type: bind
              source: ./data/youtarr/jobs
              target: /app/jobs
              bind:
                  create_host_path: false

            - type: bind
              source: ./data/youtarr/images
              target: /app/server/images
              bind:
                  create_host_path: false
        networks:
            - default
            - database
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "--fail",
                    "--silent",
                    "--show-error",
                    "--output",
                    "/dev/null",
                    "http://localhost:3011/api/health",
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        logging: *logging

    navidrome:
        image: deluan/navidrome:0.64.1
        user: "${PUID:?}:${PGID:?}"
        restart: unless-stopped
        environment:
            TZ: ${TZ:?}
            ND_MUSICFOLDER: /music
            ND_DATAFOLDER: /data
            ND_BASEURL: /navidrome
            ND_SCANNER_SCHEDULE: "${NAVIDROME_SCAN_SCHEDULE:?}"
            ND_SCANNER_WATCHERWAIT: "10s"
            ND_AUTOIMPORTPLAYLISTS: "true"
            # Visible to authenticated player accounts, including non-admin Amperfy users.
            ND_DEFAULTPLAYLISTPUBLICVISIBILITY: "true"
            ND_ENABLEMEDIAFILECOVERART: "true"
            ND_COVERARTPRIORITY: "cover.*, folder.*, front.*, embedded, *.jpg, external"
            ND_ENABLEINSIGHTSCOLLECTOR: "false"
        volumes:
            - type: bind
              source: ./data/navidrome
              target: /data
              bind:
                  create_host_path: false

            # Mount the whole output tree so Youtarr's relative M3U paths resolve.
            - type: bind
              source: ./media/youtube
              target: /music
              read_only: true
              bind:
                  create_host_path: false
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "--fail",
                    "--silent",
                    "--show-error",
                    "--output",
                    "/dev/null",
                    "http://localhost:4533/ping",
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s
        logging: *logging

networks:
    default:
    database:
        internal: true

volumes:
    database:
